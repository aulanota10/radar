<script>
(function () {
  /* ====== PREENCHA APENAS UM DOS DOIS ======
     CF_TOKEN  -> Cloudflare Web Analytics: conta acesso por dia. So isso.
     UMAMI_ID  -> Umami (plano gratuito): conta acesso por dia E clique em link de edital.
     Deixe o outro como "". Se os dois ficarem vazios, nada e carregado e o site
     funciona normalmente. */
  var CF_TOKEN  = "";
  var UMAMI_ID  = "c0d5e94d-5b5d-4cce-b713-8cab72f83ff2";
  var UMAMI_SRC = "https://cloud.umami.is/script.js";

  function carregar(src, attrs) {
    var s = document.createElement("script");
    s.async = true; s.defer = true; s.src = src;
    for (var k in attrs) s.setAttribute(k, attrs[k]);
    document.head.appendChild(s);
  }

  if (UMAMI_ID) {
    carregar(UMAMI_SRC, { "data-website-id": UMAMI_ID });
  } else if (CF_TOKEN) {
    carregar("https://static.cloudflareinsights.com/beacon.min.js",
             { "data-cf-beacon": '{"token":"' + CF_TOKEN + '"}' });
  }

  /* Clique em link que sai do radar (edital, portal da instituicao).
     Registra so no Umami. Com Cloudflare fica inerte, sem erro. */
  document.addEventListener("click", function (e) {
    var alvo = e.target;
    if (!alvo || !alvo.closest) return;
    var a = alvo.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (!/^https?:/i.test(href)) return;
    try { if (new URL(href, location.href).host === location.host) return; } catch (err) { return; }
    if (window.umami && typeof window.umami.track === "function") {
      window.umami.track("saida-edital", { destino: href });
    }
  }, true);
})();
</script>
