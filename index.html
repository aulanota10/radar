const HOJE = new Date();
HOJE.setHours(0, 0, 0, 0);
const MES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
function d(iso) {
  if (!iso || typeof iso !== "string") return null;
  const [a, m, dd] = iso.split("-").map(Number);
  if (!a || !m || !dd) return null;
  return new Date(a, m - 1, dd);
}
function fmt(iso) {
  const x = d(iso);
  return x ? `${String(x.getDate()).padStart(2, "0")}/${String(x.getMonth() + 1).padStart(2, "0")}/${x.getFullYear()}` : "A definir";
}
function fmtDM(iso) {
  const x = d(iso);
  return x ? `${String(x.getDate()).padStart(2, "0")}/${String(x.getMonth() + 1).padStart(2, "0")}` : "";
}
function fmtCurto(iso) {
  const x = d(iso);
  return x ? `${String(x.getDate()).padStart(2, "0")} ${MES[x.getMonth()]}` : "A definir";
}
function dias(iso) {
  const x = d(iso);
  return x ? Math.round((x - HOJE) / 86400000) : null;
}
function textoData(dt) {
  if (!dt) return "A definir";
  if (dt.tipo === "exata") return fmt(dt.valor);
  if (dt.tipo === "periodo") return `${fmt(dt.valor)} a ${fmt(dt.fim)}`;
  return "A divulgar";
}
function textoDataCurta(dt) {
  if (!dt || dt.tipo === "nao_divulgada") return "a divulgar";
  if (dt.tipo === "periodo" && dt.fim && dt.fim !== dt.valor) return `${fmtDM(dt.valor)} a ${fmtDM(dt.fim)}`;
  return fmtDM(dt.valor);
}
function plural(n, um, varios) {
  return `${n} ${n === 1 ? um : varios}`;
}

// ── texto: comparação sem acento e sem caixa ──
function norm(t) {
  return String(t == null ? "" : t).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
const MINUSCULAS = new Set(["de", "da", "do", "das", "dos", "e", "em", "na", "no", "nas", "nos", "a", "o", "à", "às", "ao", "aos", "para", "com", "ou", "por"]);
const ROMANOS = /^(i|ii|iii|iv|v|vi|vii|viii|ix|x|xi|xii)$/;
// Nome todo em maiúsculas vira caixa de título ("BIOLOGIA CELULAR" → "Biologia Celular").
function caixaTitulo(s) {
  const t = String(s || "");
  const letras = t.replace(/[^A-Za-zÀ-ÿ]/g, "");
  if (letras.length < 4 || letras !== letras.toUpperCase()) return t;
  let i = 0;
  return t.toLowerCase().replace(/[a-zà-ÿ]+/g, w => {
    const r = ROMANOS.test(w) ? w.toUpperCase() : i > 0 && MINUSCULAS.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1);
    i++;
    return r;
  });
}

eração."], ["Homologação", "Ato que encerra oficialmente o concurso e publica o resultado final no Diário Oficial. É a partir dela que corre o prazo de validade e podem ocorrer as nomeações."]];

      contagemUF,
      total: universo.length,
      unidade: un,
      onLimpar: limpar
    }));
}


ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<!-- Medicao de acesso. Sem cookie, sem banner de consentimento. -->
<script>
(function () {
  /* ====== PREENCHA APENAS UM DOS DOIS ======
     CF_TOKEN  -> Cloudflare Web Analytics: conta acesso por dia. So isso.
     UMAMI_ID  -> Umami (plano gratuito): conta acesso por dia E clique em link de edital.
     Deixe o outro como "". Se os dois ficarem vazios, nada e carregado e o site
     funciona normalmente. */
  var CF_TOKEN  = "";
  var UMAMI_ID  = "c0d5e94d-5b5d-4cce-b713-8cab72f83ff2";
  var UMAMI_SRC = "https://cloud.umami.is/script.js";

  function carregar(src, attrs) {
    var s = document.createElement("script");
    s.async = true; s.defer = true; s.src = src;
    for (var k in attrs) s.setAttribute(k, attrs[k]);
    document.head.appendChild(s);
  }

  if (UMAMI_ID) {
    carregar(UMAMI_SRC, { "data-website-id": UMAMI_ID });
  } else if (CF_TOKEN) {
    carregar("https://static.cloudflareinsights.com/beacon.min.js",
             { "data-cf-beacon": '{"token":"' + CF_TOKEN + '"}' });
  }

  /* Clique em link que sai do radar (edital, portal da instituicao).
     Registra so no Umami. Com Cloudflare fica inerte, sem erro. */
  document.addEventListener("click", function (e) {
    var alvo = e.target;
    if (!alvo || !alvo.closest) return;
    var a = alvo.closest("a[href]");
    if (!a) return;
    if (a.hasAttribute("data-umami-event")) return;
    var href = a.getAttribute("href") || "";
    if (!/^https?:/i.test(href)) return;
    try { if (new URL(href, location.href).host === location.host) return; } catch (err) { return; }
    if (window.umami && typeof window.umami.track === "function") {
      window.umami.track("saida-edital", { destino: href });
    }
  }, true);
})();
</script>
