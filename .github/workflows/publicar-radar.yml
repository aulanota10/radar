name: Publicar Radar na Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'dados.js'
      - 'validar-dados.js'
      - '.github/workflows/publicar-radar.yml'
  workflow_dispatch:

concurrency:
  group: publicar-radar
  cancel-in-progress: false

jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar o node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar o dados.js
        run: node validar-dados.js

      - name: Separar o que vai ser publicado
        run: |
          mkdir -p publicar
          cp dados.js publicar/dados.js
          echo "Arquivos que serao enviados:"
          ls -la publicar/

      - name: Enviar para a Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVIDOR }}
          username: ${{ secrets.FTP_USUARIO }}
          password: ${{ secrets.FTP_SENHA }}
          protocol: ftps
          local-dir: ./publicar/
          server-dir: ./
          dry-run: false
